# Build Docker image on GitHub → push to GHCR → trigger Dokploy redeploy.
#
# Required GitHub secrets:
#   DOKPLOY_API_KEY  — Dokploy server API key
#   DOKPLOY_APP_ID   — Dokploy application ID for this app

name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Validate Clerk build configuration
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          node <<'NODE'
          const key = process.env.CLERK_PUBLISHABLE_KEY ?? '';
          if (!/^pk_(live|test)_[A-Za-z0-9_-]{10,}$/.test(key)) {
            console.error('NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is absent or malformed.');
            process.exit(1);
          }
          NODE

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_REF=${{ github.ref_name }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          no-cache: true

      - name: Trigger Dokploy redeploy
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:"%s" ${{ github.sha }})
          COMMIT_AUTHOR=$(git log -1 --pretty=format:"%an" ${{ github.sha }})
          COMMIT_DATE=$(git log -1 --pretty=format:"%ci" ${{ github.sha }})
          DESCRIPTION="${COMMIT_AUTHOR} · ${COMMIT_DATE}"$'\n\n'"${{ github.sha }}"

          RESPONSE=$(curl --silent --show-error \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            -o /tmp/dokploy_response.json \
            -w "%{http_code}" \
            -X POST "https://dokploy.prochat.tools/api/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"applicationId\": \"${{ secrets.DOKPLOY_APP_ID }}\",
              \"title\": $(echo "$COMMIT_MSG" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().strip()))'),
              \"description\": $(echo "$DESCRIPTION" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().strip()))')
            }")

          echo "HTTP status: $RESPONSE"
          cat /tmp/dokploy_response.json

          if [ "$RESPONSE" != "200" ]; then
            echo "::error title=Dokploy redeploy failed::Dokploy returned HTTP $RESPONSE. Verify DOKPLOY_API_KEY, DOKPLOY_APP_ID, and Dokploy application availability."
            exit 1
          fi

          echo "Deployment triggered successfully."
