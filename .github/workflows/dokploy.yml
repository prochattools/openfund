# Build Docker image on GitHub → push to GHCR → trigger Dokploy redeploy.
#
# Required GitHub secrets:
#   DOKPLOY_API_KEY  — Dokploy server API key
#   DOKPLOY_APP_ID   — Dokploy application ID for this app

name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_REF=${{ github.ref_name }}
            NEXT_PUBLIC_AUTH_PROVIDER=disabled
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          no-cache: true

      - name: Verify Dokploy configuration, redeploy, and await convergence
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APP_ID: ${{ secrets.DOKPLOY_APP_ID }}
          DOKPLOY_EXPECTED_IMAGE: ghcr.io/${{ github.repository }}:latest
          EXPECTED_BUILD_SHA: ${{ github.sha }}
          DOKPLOY_API_BASE: https://dokploy.prochat.tools/api
          PRODUCTION_ORIGIN: https://finance.yeshua.academy
        run: node scripts/dokploy-rollout.mjs
