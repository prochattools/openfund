version: '3.8'

# Local-only PostgreSQL for development and migration testing.
# This file contains ONLY placeholder credentials — never production values.
# Do NOT use this file for production deployments.
#
# Usage:
#   docker compose -f docker-compose.local.yml up -d
#   docker compose -f docker-compose.local.yml down -v

volumes:
  finance_local_db:
    driver: local

services:
  postgres:
    image: "postgres:16"
    restart: "no"
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: local_dev_placeholder
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - finance_local_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_user -d finance"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
